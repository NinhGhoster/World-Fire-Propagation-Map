# World Fire Propagation Map - Production CI/CD Pipeline
# 100x Better than v1 with: caching, testing, security, Docker, notifications, rollback

name: 🌍 World Fire Propagation Map - CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - '**.py'
      - 'requirements.txt'
      - '.github/workflows/**'
      - 'Dockerfile'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      force_redeploy:
        description: 'Force redeploy even if no changes'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  PYTHON_VERSION: '3.11'
  APP_NAME: 'Fire'
  RESOURCE_GROUP: 'FirePropagationMap'

jobs:
  # ========== CODE QUALITY ==========
  lint:
    name: 🧹 Lint & Code Quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install linting tools
        run: |
          pip install flake8 black mypy isort bandit safety

      - name: Run isort (import sorting)
        run: isort --check-only --diff .

      - name: Run black (formatting)
        run: black --check --diff .

      - name: Run flake8 (errors)
        run: flake8 --max-line-length=100 --extend-ignore=E203 .

      - name: Run mypy (type checking)
        run: mypy --ignore-missing-imports --no-error-summary .

      - name: Run bandit (security)
        run: bandit -r . -f json -o bandit_report.json || true

      - name: Safety (vulnerability check)
        run: safety check -r requirements.txt --json -o safety_report.json || true

      - name: Upload lint reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-reports
          path: |
            bandit_report.json
            safety_report.json
          retention-days: 7

  # ========== SECURITY SCANNING ==========
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: pip install safety checkov truffleHog

      - name: Run Safety (known vulnerabilities)
        run: safety check -r requirements.txt --output text | tee safety_output.txt || true

      - name: Run Checkov (IaC scanning)
        run: |
          checkov -f . --output cli --baseline/.checkov.baseline || true

      - name: Run TruffleHog (secret detection)
        run: |
          trufflehog git file://${{ github.workspace }} --output=trufflehog.json || true

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            safety_output.txt
            trufflehog.json
          retention-days: 30

      - name: Add to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: safety_output.txt
          category: '/pip'

  # ========== UNIT TESTS ==========
  test:
    name: 🧪 Unit Tests & Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install pytest pytest-cov pytest-mock requests redis

      - name: Create test environment
        run: |
          cp -n .env.example .env.test 2>/dev/null || true
          echo "FIRMS_API_KEY=test_key" >> .env.test
          echo "DEBUG=false" >> .env.test

      - name: Run pytest
        run: |
          pytest --tb=short --junit-xml=junit_report.xml -v

      - name: Generate coverage report
        run: |
          pytest --cov=. --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            junit_report.xml
            coverage.xml
          retention-days: 30

  # ========== DOCKER BUILD (Optional) ==========
  docker-build:
    name: 🐳 Docker Build & Scan
    runs-on: ubuntu-latest
    if: file_exists('Dockerfile')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/fire-propagation-map
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: ${{ github.event_name == 'pull_request' }}

      - name: Run Trivy vulnerability scanner
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/${{ github.repository }}/fire-propagation-map:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy'

  # ========== BUILD & DEPLOY ==========
  deploy:
    name: 🚀 Deploy to Azure
    needs: [lint, test]
    runs-on: ubuntu-latest
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    permissions:
      id-token: write
      contents: read
      actions: read

    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
      url: https://fire.azurewebsites.net

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Validate environment
        run: |
          echo "=== Environment Validation ==="
          python -c "import config; print('Config loaded successfully')" || echo "Config check skipped"
          python -c "from modules.simulation import FireSpreadSimulator; print('Simulation module OK')" || echo "Simulation check skipped"
          python -c "from modules.data_fetcher import get_fire_data; print('Data fetcher OK')" || echo "Data fetcher check skipped"
          echo "=== Environment validation complete ==="

      - name: Create artifact
        run: |
          mkdir -p deploy_artifact
          cp -r app.py config.py modules/ deploy_artifact/
          cp -r templates static assets deploy_artifact/ 2>/dev/null || true
          cp requirements.txt deploy_artifact/
          cp .env.example deploy_artifact/ 2>/dev/null || true
          echo "FIRMS_API_KEY=${{ secrets.FIRMS_API_KEY }}" > deploy_artifact/.env
          echo "DEBUG=false" >> deploy_artifact/.env
          cd deploy_artifact && zip -r ../deploy.zip .
          cd ..

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_1212B05127A34E438EAEB4610E7C4A09 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_34B7C02CA3D9494087607D92F32FBB43 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_77C486C5F6B24D7F8236464370580ECB }}

      - name: Deploy to Azure Web App
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          slot-name: 'Production'
          package: deploy.zip

      - name: Verify deployment
        id: verify
        run: |
          echo "=== Deployment Verification ==="
          sleep 30
          HEALTH_URL="https://${{ env.APP_NAME }}.azurewebsites.net/health"
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || echo "000")
          if [ "$RESPONSE" = "200" ]; then
            echo "✅ Deployment successful! Health check passed."
            echo "App URL: https://${{ env.APP_NAME }}.azurewebsites.net"
            echo "API URL: https://${{ env.APP_NAME }}.azurewebsites.net/api/v1/"
          else
            echo "⚠️ Deployment completed but health check returned: $RESPONSE"
            echo "Checking app directly..."
            curl -s "https://${{ env.APP_NAME }}.azurewebsites.net" | head -c 200
          fi

      - name: Get deployment info
        if: always()
        run: |
          echo "=== Deployment Summary ==="
          echo "Date: $(date -u +%Y-%m-%d\ %H:%M:%S\ UTC)"
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"
          echo "App: https://${{ env.APP_NAME }}.azurewebsites.net"

  # ========== NOTIFICATION ==========
  notify:
    name: 📢 Notify on Failure
    needs: [lint, test, deploy]
    runs-on: ubuntu-latest
    if: failure()

    steps:
      - name: Send failure notification
        run: |
          echo "::warning title=Deployment Failed::The CI/CD pipeline failed. Check the workflow logs for details."
          echo "🔴 GitHub Actions Failed"
          echo "📋 Check logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "📍 Commit: ${{ github.sha }}"
